[package]
name = "skj-flash"
version = "0.1.0"
edition = "2021"
description = "SKJ Flash - make bootable USB drives on Windows, Linux and macOS"
authors = ["SKJ Tech"]
# GPL to match SKJ Files, and because the multiboot work will build on GRUB.
license = "GPL-3.0-only"
# The one place the project's home is written down. Moving the repo means changing this line
# and the git remote - nothing else.
repository = "https://github.com/jakub362/skj-flash"

build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
